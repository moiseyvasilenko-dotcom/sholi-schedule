<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Темы встреч молодёжки">
  <title>Темы · Молодёжка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Темы молодёжки">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Молодёжка</span>
      </a>
      <div class="header-actions">
        <span id="sync-state" class="sync-state" aria-live="polite">Обновление…</span>
        <button id="refresh-btn" class="icon-button" type="button" aria-label="Обновить список" title="Обновить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
        </button>
        <button id="theme-btn" class="icon-button" type="button" aria-label="Сменить тему" title="Сменить тему">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button id="add-btn" class="add-button" type="button">Добавить</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Темы</h1>
        <p id="summary">Загружаем список…</p>
      </div>
    </section>

    <section class="controls" aria-label="Фильтры тем">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search-input" type="search" placeholder="Найти тему" autocomplete="off">
        <button id="search-clear" class="clear-button hidden" type="button" aria-label="Очистить поиск">×</button>
      </label>
      <div id="status-filter" class="status-filter" aria-label="Статус">
        <button class="active" type="button" data-status="all">Все</button>
        <button type="button" data-status="free">Свободные</button>
        <button type="button" data-status="taken">Занятые</button>
      </div>
    </section>

    <nav id="category-filter" class="categories" aria-label="Разделы тем"></nav>
    <div id="offline-note" class="notice hidden" role="status">Нет сети. Показываем сохранённый список.</div>
    <section id="topic-list" class="topic-list" aria-live="polite" aria-busy="true"></section>
  </main>

  <dialog id="add-dialog" class="modal">
    <form id="add-form" method="dialog" class="modal-card">
      <div class="modal-head">
        <h2>Новая тема</h2>
        <button id="add-close" class="icon-button" type="button" aria-label="Закрыть">×</button>
      </div>
      <label class="field">
        <span>Название</span>
        <input id="add-title" type="text" maxlength="120" required autofocus>
      </label>
      <label class="field">
        <span>Короткое пояснение <em>необязательно</em></span>
        <input id="add-note" type="text" maxlength="200">
      </label>
      <fieldset class="field category-field">
        <legend>Раздел</legend>
        <div id="add-categories" class="category-options"></div>
      </fieldset>
      <div class="modal-actions">
        <button id="add-cancel" class="button secondary" type="button">Отмена</button>
        <button class="button primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
